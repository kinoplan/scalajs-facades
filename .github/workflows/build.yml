name: build

on: [push, pull_request]

env:
  SBT_JAVA_OPTS: -J-Xms4G -J-Xmx4G

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content'
  build:
    needs: pre-check
    if: needs.pre-check.outputs.should_skip != 'true' || github.event_name == 'pull_request'
    name: Generate and Compile
    runs-on: ubuntu-latest
    steps:
    - name: Checkout current branch
      uses: actions/checkout@v7

    - name: Cache build
      uses: coursier/cache-action@v9

    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17
        cache: sbt
    - uses: sbt/setup-sbt@v1
    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Scalafmt check sbt
      run: sbt $SBT_JAVA_OPTS -v scalafmtSbtCheck

    # the generated modules (with their compiled classes) depend only on the build definition,
    # so a change that does not touch it, e.g. in the docs, reuses them
    - name: Cache generated facades
      id: facades-cache
      uses: actions/cache@v6
      with:
        path: |
          sjr-modules
          facade-modules.sbt
        key: facades-${{ hashFiles('build.sbt', 'alias.sbt', 'project/*.scala', 'project/*.sbt', 'project/build.properties') }}

    # converts npm packages to Scala sources and splits them into modules (facade-modules.sbt)
    - name: Generate facades
      if: steps.facades-cache.outputs.cache-hit != 'true'
      run: sbt $SBT_JAVA_OPTS -v genFacades

    - name: Compile facades
      run: sbt $SBT_JAVA_OPTS -v compileFacades

name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  SBT_JAVA_OPTS: -J-Xms4G -J-Xmx4G
  PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
  PGP_SECRET: ${{ secrets.PGP_SECRET }}
  SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
  SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v9
      - uses: coursier/setup-action@v3
        with:
          jvm: "temurin:17"
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # the modules are generated, so they must exist before sbt loads the build that publishes them
      - name: Generate facades
        run: sbt $SBT_JAVA_OPTS genFacades
      - name: Publish
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: sbt $SBT_JAVA_OPTS ci-release
